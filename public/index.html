<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CookieRun CAPTCHA Auto-Solver</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">🧩</span>
        <h1>CAPTCHA Auto-Solver Controller</h1>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">พร้อมใช้งาน</span>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="solver-grid">
      <!-- Left Column: Controls & System Logs -->
      <section class="left-panel">
        <div class="card control-card">
          <div class="card-header">
            <h2>🚀 สวิตช์ควบคุมระบบแก้ CAPTCHA</h2>
          </div>
          <div class="button-group">
            <button id="toggleSolverBtn" class="btn btn-primary btn-large w-full">
              <span class="btn-icon">▶</span>
              <span class="btn-text">เปิดระบบแก้ CAPTCHA อัตโนมัติ</span>
            </button>
            <button id="solveOnceBtn" class="btn btn-outline btn-large w-full" style="margin-top: 10px;">
              ⚡ แก้ CAPTCHA ทันที 1 ครั้ง (Manual Solve)
            </button>
          </div>
        </div>

        <div class="card logs-card">
          <div class="card-header">
            <h2>📜 บันทึกการถอดรหัส (Solver Logs)</h2>
            <button class="btn btn-sm btn-outline" id="clearLogsBtn">🗑️ เคลียร์</button>
          </div>
          <div class="logs-container" id="logsContainer">
            <div class="log-entry muted">[System] ระบบถอดรหัสแก้ CAPTCHA อัตโนมัติพร้อมใช้งานแล้ว</div>
          </div>
        </div>
      </section>

      <!-- Right Column: Live Screen Stream -->
      <section class="right-panel">
        <div class="card live-card">
          <div class="card-header">
            <h2>📺 จอแสดงผลสด MuMu (Live Monitor)</h2>
            <button class="btn btn-sm btn-outline" id="refreshStreamBtn">🔄 รีเฟรช</button>
          </div>
          <div class="stream-wrapper">
            <img id="screenImg" src="/api/screenshot" alt="MuMu Live Monitor" loading="eager">
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
