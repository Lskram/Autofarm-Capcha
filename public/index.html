<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Recorder Web Controller</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">📱</span>
        <h1>Operation Recorder Controller</h1>
      </div>
      <div class="header-actions">
        <div class="status-badge" id="statusBadge">
          <span class="status-dot"></span>
          <span id="statusText">พร้อมใช้งาน</span>
        </div>
        <button id="toggleFarmingBtn" class="btn btn-primary">
          <span class="btn-icon">▶</span>
          <span class="btn-text">เริ่มทำงานอัตโนมัติ (Start Loop)</span>
        </button>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="main-grid">
      <!-- Left Column: Operation Recorder Scripts List (เหมือนในภาพเป๊ะๆ) -->
      <section class="card recorder-card">
        <div class="card-header">
          <h2>📋 Operation Recorder Scripts</h2>
          <button class="btn btn-sm btn-outline" id="refreshScriptsBtn">🔄 รีเฟรชรายการ</button>
        </div>
        
        <!-- List Container -->
        <div class="script-list" id="scriptList">
          <div class="loading-text">กำลังโหลดรายการสคริปต์...</div>
        </div>
      </section>

      <!-- Right Column: Live View & System Logs -->
      <section class="right-column">
        <!-- Live Stream Card -->
        <div class="card live-card">
          <div class="card-header">
            <h2>📺 จอแสดงผล MuMu</h2>
            <button class="btn btn-sm btn-outline" id="refreshStreamBtn">🔄 รีเฟรช</button>
          </div>
          <div class="stream-wrapper">
            <img id="screenImg" src="/api/screenshot" alt="MuMu Live Screen" loading="eager">
          </div>
        </div>

        <!-- Logs Card -->
        <div class="card logs-card">
          <div class="card-header">
            <h2>📜 บันทึกสถานะ (System Logs)</h2>
            <button class="btn btn-sm btn-outline" id="clearLogsBtn">🗑️ เคลียร์</button>
          </div>
          <div class="logs-container" id="logsContainer">
            <div class="log-entry muted">[System] ระบบพร้อมใช้งานแล้ว</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
